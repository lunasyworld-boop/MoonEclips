name: Build MoonWipe

on:
  push:
    branches:
      - moonwipe-development
    paths:
      - "MoonWipe/**"
      - ".github/workflows/moonwipe-build.yml"
  pull_request:
    paths:
      - "MoonWipe/**"
      - ".github/workflows/moonwipe-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: MoonWipe/pom.xml
      - name: Build and test
        run: mvn -B -f MoonWipe/pom.xml clean verify
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: MoonWipe-1.0.0
          path: MoonWipe/target/MoonWipe-1.0.0.jar
          if-no-files-found: error
          retention-days: 14
