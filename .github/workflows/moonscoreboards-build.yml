name: Build Moonscoreboards
on:
  push:
    paths:
      - 'Moonscoreboards/**'
      - '.github/workflows/moonscoreboards-build.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build plugin
        working-directory: Moonscoreboards
        run: mvn -B clean package
      - uses: actions/upload-artifact@v4
        with:
          name: Moonscoreboards-1.3.0-beta
          path: Moonscoreboards/target/Moonscoreboards-1.3.0-beta.jar
          if-no-files-found: error